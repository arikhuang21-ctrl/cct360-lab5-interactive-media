<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desk Sounds | CCT360 Lab 5</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p>CCT360 · Lab 5 · Version 1</p>
      <h1>Desk Sounds</h1>
      <p>A small collection of sounds from my desk.</p>
    </header>

    <section class="sound-card" aria-labelledby="sound-title">
      <img id="sound-image" src="pencil.svg" alt="A pencil drawing a line on paper">
      <div class="sound-info">
        <p id="sound-number" class="number">Sound 1 of 3</p>
        <h2 id="sound-title">Pencil</h2>
        <p id="sound-description">A pencil moving across a sheet of paper.</p>
        <button id="play-button" type="button" aria-pressed="false">Play sound</button>
        <p id="sound-status" class="status" aria-live="polite">Pencil sound is paused.</p>
        <label for="volume">Volume</label>
        <input id="volume" type="range" min="0" max="1" step="0.05" value="0.45">
        <audio id="sound-audio" preload="auto">
          <source src="pencil.wav" type="audio/wav">
        </audio>
      </div>
    </section>

    <nav class="sound-list" aria-label="Choose a desk sound">
      <button class="sound-choice active" type="button" data-sound="0" aria-current="true">1. Pencil</button>
      <button class="sound-choice" type="button" data-sound="1">2. Keyboard</button>
      <button class="sound-choice" type="button" data-sound="2">3. Mug</button>
    </nav>
  </main>
</body>
</html>
